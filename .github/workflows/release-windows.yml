name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '挂到已有 Release 的 tag（例如 v0.1.0）。留空则只上传 Artifact'
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 打包 NSIS 安装程序
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release/**/*-win-*-setup.exe

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: |
            release/**/*-win-*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
